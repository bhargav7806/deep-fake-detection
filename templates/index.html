<!DOCTYPE html>

<html>

<head>

    <title>DeepFake Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>DeepFake Face Detection</h1>

<form method="POST" enctype="multipart/form-data">

    <input
        type="file"
        name="image"
        accept="image/*"
        required>

    <br><br>

    <button type="submit">
        Predict
    </button>

</form>

{% if prediction %}

<div class="result">

    {% if prediction == "REAL IMAGE" %}
        <h2 class="real">{{ prediction }}</h2>
    {% else %}
        <h2 class="ai">{{ prediction }}</h2>
    {% endif %}

  

</div>

{% endif %}
